# Load only after the certificate exists and the domain points to this host.
# This file belongs in nginx's http context, such as /etc/nginx/conf.d/.
limit_req_zone $binary_remote_addr zone=claude_export_req:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=claude_export_conn:10m;

server {
    listen 80;
    server_name claudeexport.com;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/claude-exporter/acme;
        try_files $uri =404;
    }
    location / { return 301 https://claudeexport.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name claudeexport.com;
    ssl_certificate /etc/letsencrypt/live/claudeexport.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claudeexport.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 20m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location /source/ {
        alias /opt/claude-exporter/release/;
        index index.html;
        autoindex off;
    }
    location /api/ {
        limit_req zone=claude_export_req burst=5 nodelay;
        limit_conn claude_export_conn 2;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:18760;
    }
    location / {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:18760;
    }
}
